[build]
  publish = "static"

# Rewrite /admin to /admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Rewrite /static/* asset paths for complete relative and absolute path compatibility
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Netlify API Proxy to Render Backend (Prevents all CORS issues):
[[redirects]]
  from = "/api/*"
  to = "https://agenticrms-multi-agent-orchestration-and.onrender.com/api/:splat"
  status = 200
  force = true

