services:
  - type: web
    name: agentic-rms-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: STUDENT_TOKEN_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

